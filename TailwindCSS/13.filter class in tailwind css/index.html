<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter class in tailwind css</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <img src="./bajarangi.jpg" alt="">
    <h1>blurr image</h1>
    <img class="blur" src="./bajarangi.jpg" alt="">
    <img class="blur-xs" src="./bajarangi.jpg" alt="">
    <img class="blur-sm" src="./bajarangi.jpg" alt="">
    <img class="blur-md" src="./bajarangi.jpg" alt="">
    <img class="blur-lg" src="./bajarangi.jpg" alt="">

    
    <h1>Brightness</h1>
    <img class="brightness-50 m-20" src="./bajarangi.jpg" alt="">
    <img class="brightness-100 m-20" src="./bajarangi.jpg" alt="">
    <img class="brightness-150 m-20" src="./bajarangi.jpg" alt="">
    <img class="brightness-200 m-20" src="./bajarangi.jpg" alt="">


    <h1>contrast</h1>
    <img class="contrast-50 m-20" src="./bajarangi.jpg" alt="">
    <img class="contrast-100 m-20" src="./bajarangi.jpg" alt="">
    <img class="contrast-150 m-20" src="./bajarangi.jpg" alt="">
    <img class="contrast-200 m-20" src="./bajarangi.jpg" alt="">
    <img class="contrast-250 m-20" src="./bajarangi.jpg" alt="">


    <h1>grayscale</h1>
    <img class="grayscale-50 m-20" src="./bajarangi.jpg" alt="">
    <img class="grayscale-100 m-20" src="./bajarangi.jpg" alt="">
    <img class="grayscale-150 m-20" src="./bajarangi.jpg" alt="">
    <img class="grayscale-200 m-20" src="./bajarangi.jpg" alt="">
    <img class="grayscale-250 m-20" src="./bajarangi.jpg" alt="">


    <h1>invert</h1>
    <img class="invert-300 m-20" src="./bajarangi.jpg" alt="">
    <img class="invert-100 m-20" src="./bajarangi.jpg" alt="">
    <img class="invert-200 m-20" src="./bajarangi.jpg" alt="">
    <img class="invert-250 m-20" src="./bajarangi.jpg" alt="">
    <img class="invert-300 m-20" src="./bajarangi.jpg" alt="">

    <h1>hue</h1>
    <img class="hue-rotate-90 m-20" src="./bajarangi.jpg" alt="">
    <img class="hue-rotate-180 m-20" src="./bajarangi.jpg" alt="">
    <img class="hue-rotate-270 m-20" src="./bajarangi.jpg" alt="">
    <img class="hue-rotate-360 m-20" src="./bajarangi.jpg" alt="">

    <h1>opacity</h1>
    <img class="opacity-50 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-100 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-150 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-200 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-250 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-300 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-350 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-400 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-450 m-20" src="./bajarangi.jpg" alt="">
    <img class="opacity-500 m-20" src="./bajarangi.jpg" alt="">
    

</body>
</html>
